name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit + content + determinism tests.
      - run: pnpm test
      # Cross-environment replay hash: Node vs headless Chromium (TECH §4).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - run: node scripts/determinism.mjs
        env:
          SMOKE_CHROME: ''

  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:build
      - run: pnpm --filter @mini-clash/client build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Visual smoke (boot → hub → training → full kit rotation)
        run: node scripts/smoke.mjs
        env:
          SMOKE_CHROME: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: test-results/smoke
          retention-days: 14
