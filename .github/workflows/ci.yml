name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit + content + determinism tests.
      - run: pnpm test
      # Cross-environment replay hash: Node vs headless Chromium (TECH §4).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - run: node scripts/determinism.mjs
        env:
          SMOKE_CHROME: ''

  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 200-socket soak (TECH §11 budgets)
        run: pnpm exec vitest run packages/server/test/soak.test.ts
        env:
          MC_SOAK: '1'

  deploy-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compose images (game + api + web)
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-not-a-real-password
          MC_INTERNAL_SECRET: ci-not-a-real-secret-0123456789
      - name: Deployment scripts self-test
        run: ./deploy/selftest.sh

  api-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ROADMAP v0.7 acceptance: p95 < 120 ms for hub endpoints at 100 rps.
      - name: Hub api load (100 rps, 40 accounts)
        run: node scripts/api-load.mjs --rps 100 --seconds 20 --users 40

  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:build
      - run: pnpm --filter @mini-clash/client build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Visual smoke (boot → hub → training → full kit rotation)
        run: node scripts/smoke.mjs
        env:
          SMOKE_CHROME: ''
      - name: Bridge smoke (select → rigged win → podium → summary → offline)
        run: node scripts/smoke-bridge.mjs
        env:
          SMOKE_CHROME: ''
      - name: Lag smoke (online vs server at 150ms +jitter +2% loss)
        run: node scripts/smoke-lag.mjs
        env:
          SMOKE_CHROME: ''
      - name: Lobby smoke (two browsers create/join by code into one match)
        run: node scripts/smoke-lobby.mjs
        env:
          SMOKE_CHROME: ''
      - name: Reconnect smoke (mid-fight refresh rejoin + clean server-death failure)
        run: node scripts/smoke-reconnect.mjs
        env:
          SMOKE_CHROME: ''
      - name: Draft smoke (Power Surge dock, reroll, pick, input pass-through)
        run: node scripts/shot-draft.mjs
        env:
          SHOT_CHROME: ''
      - name: Event smoke (announce, isles, golem, coins, storm, collapse)
        run: node scripts/shot-events.mjs
        env:
          SHOT_CHROME: ''
      # The hub against a real api on one origin, ending in the two-device
      # sign-in that is v0.7's headline acceptance box.
      - name: Hub smoke (account, viewer, purchase, quests, two-device sign-in)
        run: node scripts/shot-hub.mjs
        env:
          SHOT_CHROME: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: |
            test-results/smoke
            test-results/smoke-bridge
            test-results/smoke-lag
            test-results/smoke-lobby
            test-results/smoke-reconnect
            test-results/draft
            test-results/events
            test-results/hub
          retention-days: 14
