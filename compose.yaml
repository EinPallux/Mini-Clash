# Mini Clash single-box deploy (TECH §1/§15). Use `./deploy/deploy.sh` rather
# than raw compose — it backs the database up first and waits for health.
#
# **This box may not be ours alone.** Everything here is namespaced under the
# `mini-clash` project so no command in deploy/ can reach another stack's
# containers, volumes, networks or images. The only genuinely shared resources
# are the host ports below; `deploy/preflight.sh` reports on them before
# anything starts, and `compose.behind-proxy.yaml` removes the need for them
# entirely when another reverse proxy already owns :80/:443.
name: mini-clash

services:
  game:
    build:
      context: .
      target: game
    restart: unless-stopped
    environment:
      - PORT=2567
      # Linked to the api: joins need a signed ticket and matches are recorded.
      - MC_API_URL=http://api:3000
      - MC_INTERNAL_SECRET=${MC_INTERNAL_SECRET:?set MC_INTERNAL_SECRET}
    expose:
      - "2567"
    # TECH §11: a 1 GB box runs 10+ concurrent matches; cap so a leak can't
    # take the edge down with it.
    mem_limit: 768m

  # Platform api (TECH §9): accounts, coins, unlocks, quests, history. The game
  # server posts finished matches here; nothing else may write the economy.
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://mc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/miniclash
      - MC_INTERNAL_SECRET=${MC_INTERNAL_SECRET:?set MC_INTERNAL_SECRET}
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=miniclash
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d miniclash"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    # Overridable so this can live alongside another stack that already owns
    # :80/:443 — see compose.behind-proxy.yaml, which drops them entirely.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    depends_on:
      - game
      - api
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Status page (TECH §14) — point it at http://game:2567/healthz.
  #
  # Bound to loopback rather than 0.0.0.0: it is an internal tool, it has no
  # business on the public internet, and on a shared box a wildcard bind on
  # 3001 is one more port to collide with somebody else's service. Reach it
  # over an SSH tunnel:  ssh -L 3001:localhost:3001 you@your-vps
  status:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "${STATUS_BIND:-127.0.0.1}:3001:3001"
    volumes:
      - kuma-data:/app/data

volumes:
  pg-data:
  caddy-data:
  caddy-config:
  kuma-data:
